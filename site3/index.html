<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивный музей СВКИ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loader" id="loader"><img src="images/emblem.png" alt="Загрузка..."></div>
<div class="subpage-loader" id="subpageLoader"><img src="images/emblem.png" alt="Загрузка..."></div>

<div class="main-page" id="mainPage">
  <div class="decor-top-left">
    <img src="images/zhukov.png" alt="Орден Жукова" class="order-zhukov">
    <img src="images/red_banner.png" alt="Орден Красного Знамени" class="order-red-banner">
  </div>
  <div class="decor-top-right">
    <img src="images/dzerzhinsky.png" alt="Знак Дзержинского" class="dzerzhinsky">
  </div>
  <div class="title">Саратовский военный ордена Жукова краснознаменный<br>институт войск национальной гвардии<br>Российской Федерации</div>
  <div class="content" id="mainContent">
    <!-- Plates will be rendered dynamically from API -->
  </div>
</div>

<!-- Dynamic overlay containers -->
<div id="overlayContainer"></div>

<!-- Photo zoom modal -->
<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
  <img id="zoomImg" src="" alt="">
  <button class="zoom-close" onclick="closeZoom()">✕</button>
</div>

<!-- Welcome overlay (video + audio) -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-content">
    <video id="welcomeVideo" src="images/welcome.mp4" muted loop playsinline preload="auto"></video>
    <audio id="welcomeAudio" preload="auto"></audio>
    <div class="welcome-hint" id="welcomeHint">▶ Нажмите, чтобы включить звук</div>
    <button class="welcome-close" onclick="closeWelcome()" title="Закрыть">✕</button>
  </div>
</div>

<!-- Guide Chat -->
<div class="guide-btn" id="guideBtn" onclick="toggleChat()" style="display:none">
  <span class="guide-btn-icon">💬</span>
  <span class="guide-btn-label">ГИД</span>
</div>

<div class="chat-widget" id="chatWidget">
  <div class="chat-header">
    <span class="chat-header-title">Виртуальный гид</span>
    <div class="chat-header-actions">
      <button class="chat-voice-btn" id="chatVoiceToggle" onclick="toggleChatVoice()" title="Звук выключен">🔇</button>
      <button class="chat-close-btn" onclick="toggleChat()">✕</button>
    </div>
  </div>
  <div class="chat-avatar-area">
    <video class="chat-avatar-vid" id="chatAvatarIdle" src="images/guide_idle.mp4" muted loop playsinline preload="auto"></video>
    <video class="chat-avatar-vid" id="chatAvatarTalking" src="images/guide_talking.mp4" muted loop playsinline preload="auto" style="display:none"></video>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-quick" id="chatQuick"></div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Задайте вопрос..." onkeydown="chatInputKey(event)" autocomplete="off">
    <button id="chatSendBtn" onclick="sendChat()">➤</button>
  </div>
</div>

<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
